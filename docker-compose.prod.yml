services:
  front:
    image: barbercentral-front-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - target: 3002
        published: 3002
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      update_config:
        order: start-first
